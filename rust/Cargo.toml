[package]
name = "rust_lib_yhd_service_print_dome"
version = "0.1.0"
edition = "2021"

[dependencies]
flutter_rust_bridge = "=2.11.1"
tokio = { version = "1.36.0", features = ["full"] }
thiserror = "2.0.15"
encoding_rs = "0.8.34"  # 处理 ANSI 编码（对应 C# StringToCoTaskMemAnsi）
libc = "0.2.153"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }
log = "0.4.20"